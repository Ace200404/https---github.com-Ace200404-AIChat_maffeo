name: Weekly Pipeline

on:
  # Runs every Monday at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
      GHOST_URL: ${{ secrets.GHOST_URL }}
      GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Check secrets
        run: |
          python -c "
          import os
          print('SUPABASE_URL set:', bool(os.getenv('SUPABASE_URL')))
          print('SUPABASE_ANON_KEY set:', bool(os.getenv('SUPABASE_ANON_KEY')))
          print('TRANSISTOR_API_KEY set:', bool(os.getenv('TRANSISTOR_API_KEY')))
          "

      - name: Run pipeline
        run: python scripts/run_pipeline.py

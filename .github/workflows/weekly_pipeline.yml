name: Weekly Pipeline

on:
  # Runs every Monday at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
      GHOST_URL: ${{ secrets.GHOST_URL }}
      GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Check secrets
        run: |
          echo "=== GitHub expression check ==="
          echo "SUPABASE_URL expression non-empty: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_ANON_KEY expression non-empty: ${{ secrets.SUPABASE_ANON_KEY != '' }}"
          echo "TRANSISTOR_API_KEY expression non-empty: ${{ secrets.TRANSISTOR_API_KEY != '' }}"
          echo "=== Env var check ==="
          [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL env: SET (len=${#SUPABASE_URL})" || echo "SUPABASE_URL env: EMPTY"
          [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY env: SET (len=${#SUPABASE_ANON_KEY})" || echo "SUPABASE_ANON_KEY env: EMPTY"
          [ -n "$TRANSISTOR_API_KEY" ] && echo "TRANSISTOR_API_KEY env: SET (len=${#TRANSISTOR_API_KEY})" || echo "TRANSISTOR_API_KEY env: EMPTY"

      - name: Run pipeline
        run: python scripts/run_pipeline.py

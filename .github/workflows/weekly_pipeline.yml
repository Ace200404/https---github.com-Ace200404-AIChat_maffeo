name: Weekly Pipeline

on:
  # Runs every Monday at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
      TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Maffeo_vault/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r Maffeo_vault/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Run pipeline
        working-directory: Maffeo_vault
        run: python scripts/run_pipeline.py
